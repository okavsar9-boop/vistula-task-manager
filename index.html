<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <meta name="description" content="Task Manager – Vistula Team Project">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✔️%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <aside class="panel">
      <header class="masthead">
        <h1>Task Manager</h1>
        <p class="owner">Ominakavsar Abduganieva<br>Student ID <strong id="student-id">74026</strong></p>
      </header>

      <div class="dial" aria-label="Progress">
        <svg viewBox="0 0 120 120" role="img" aria-label="Completion progress">
          <circle class="dial-track" cx="60" cy="60" r="52"/>
          <circle class="dial-fill" id="dial-fill" cx="60" cy="60" r="52"/>
        </svg>
        <div class="dial-text"><b id="dial-pct">0%</b><span id="dial-sub">no tasks yet</span></div>
      </div>

      <form id="task-form" autocomplete="off">
        <h2 id="form-title">New task</h2>
        <label for="task-title">Title</label>
        <input id="task-title" type="text" maxlength="120" required placeholder="What needs doing?">
        <label for="task-description">Description <span class="opt">optional</span></label>
        <textarea id="task-description" rows="3" maxlength="500" placeholder="Add a few details"></textarea>
        <div class="row">
          <button id="task-submit" type="submit">Add task</button>
          <button id="task-cancel" type="button" hidden>Cancel</button>
        </div>
      </form>
    </aside>

    <section class="board" aria-labelledby="board-title">
      <div class="board-head">
        <h2 id="board-title">Your tasks</h2>
        <div class="tabs" role="group" aria-label="Filter tasks">
          <button type="button" data-filter="all" aria-pressed="true">All <i id="n-all">0</i></button>
          <button type="button" data-filter="active" aria-pressed="false">Open <i id="n-active">0</i></button>
          <button type="button" data-filter="done" aria-pressed="false">Done <i id="n-done">0</i></button>
        </div>
      </div>

      <p id="status-message" role="status" aria-live="polite"></p>
      <ul id="task-list"></ul>

      <footer class="foot">
        <a id="contribution-link" href="contribution.html">View team contribution</a>
      </footer>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
